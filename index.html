<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title></title>

    <style>
      body {
    margin: 0;
    min-height: 100vh;
    background: #000;
    position: relative;
    overflow-x: hidden;
}

/* ลายตาราง 5 เหลี่ยมสีทอง */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;

    background-image: url("data:image/svg+xml,%3Csvg width='100' height='116' viewBox='0 0 100 116' xmlns='http://www.w3.org/2000/svg'%3E%3Cpolygon points='50,2 98,36 80,112 20,112 2,36' fill='none' stroke='%23A67C00' stroke-width='1.2'/%3E%3C/svg%3E");

    background-size: 100px 116px;

    opacity: 0.7;

    /* ไล่เฟดจากกลางออกไป */
    mask-image: radial-gradient(
        ellipse at center,
        black 0%,
        black 30%,
        rgba(0,0,0,0.7) 55%,
        transparent 90%
    );

    -webkit-mask-image: radial-gradient(
        ellipse at center,
        black 0%,
        black 30%,
        rgba(0,0,0,0.7) 55%,
        transparent 90%
    );
}

/* แสงทองเข้มตรงกลาง */
body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;

    background:
        radial-gradient(
            circle at center,
            rgba(166, 124, 0, 0.13) 0%,
            rgba(166, 124, 0, 0.05) 35%,
            transparent 70%
        );
}
    </style>

</head>

<body>



    <script>

    </script>

</body>

</html>
