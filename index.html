    <style>
        * {

        .container {

            font-size: 52px;

    box-shadow: 0 0 25px rgba(212, 175, 55, 0.12);

}

        .card h2 {
            color: #d4af37;

            letter-spacing: 3px;
        }

        .card p {
            color: #aaa;

        .links {

        }

         button {

            background: none;
            border: none;
            color: white;
            font-family: Cinzel;
        }

        .links a {
            display: block;
            text-decoration: none;
            color: white;
            border: 1px solid #5c4a17;
            padding: 15px;
            margin-top: 12px;
            border-radius: 8px;
            transition: 0.3s;
        }

        .links a:hover {
            background: #d4af37;
            color: #000;
        }

        footer {
            margin-top: 60px;
            font-size: 11px;
            color: #555;
            letter-spacing: 2px;
        }
@keyframes cardAppear {
    from {
        opacity: 0;
        transform: translateY(20px);
        box-shadow: 0 0 0 rgba(212, 175, 55, 0);
    }

    to {
        opacity: 1;
        transform: translateY(0);
        box-shadow: 0 0 25px rgba(212, 175, 55, 0.12);
    }
}
